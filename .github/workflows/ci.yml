name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 実行の重複制御
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # CI + ブランチ参照
  cancel-in-progress: true # 新しい実行を優先し、打ち切る

# CI時にGithubから発行されるトークンの権限
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy # ダミー
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
