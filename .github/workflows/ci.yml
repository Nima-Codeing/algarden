name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 実行の重複制御
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # CI + ブランチ参照
  cancel-in-progress: true # 新しい実行を優先し、打ち切る

# CI時にGithubから発行されるトークンの権限
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres-db:
        image: postgres:16
        env:
          POSTGRES_USER: algarden
          POSTGRES_PASSWORD: algarden
          POSTGRES_DB: algarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://algarden:algarden@localhost:5432/algarden

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to an empty database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Check migrations match schema.prisma
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
